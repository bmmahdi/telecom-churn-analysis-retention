name: Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run SQL queries
        run: python scripts/run_sql.py
      - name: Run the notebook
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/analysis.ipynb --ExecutePreprocessor.timeout=900
      - name: Check outputs
        run: python scripts/check_outputs.py
      - name: Save results
        run: |
          mkdir -p docs/data docs/charts
          cp outputs/summary.json docs/data/summary.json
          cp outputs/charts/*.png docs/charts/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update analysis results [skip ci]"
          git push
